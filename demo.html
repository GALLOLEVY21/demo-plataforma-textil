  };

        if (p && p.date === today && p.db) return p.db;
      }
    } catch (e) {}
    const db = buildSeed(today);
    save(db);
    return db;
  };
  const db = load();
  const counters = {};
  Object.keys(db).forEach(t => {
    let mx = 0;
    db[t].forEach(r => {
      const n = Number(r.id);
      if (!isNaN(n) && n > mx) mx = n;
    });
    counters[t] = mx;
  });
  const nextId = t => {
    counters[t] = (counters[t] || 0) + 1;
    return counters[t];
  };
  const passes = (r, filters) => filters.every(f => {
    if (f.type === "eq") return String(r[f.col]) === String(f.val);
    if (f.type === "in") return f.val.map(String).includes(String(r[f.col]));
    return true;
  });
  function makeBuilder(table) {
    const st = {
      op: "select",
      filters: [],
      order: null,
      payload: null,
      patch: null,
      single: false,
      maybe: false,
      wantSelect: false,
      upsertKey: "id"
    };
    const exec = () => {
      if (!db[table]) db[table] = [];
      const res = {
        data: null,
        error: null
      };
      try {
        if (st.op === "select") {
          let rows = db[table].filter(r => passes(r, st.filters));
          if (st.order) {
            const {
              col,
              ascending
            } = st.order;
            rows = [...rows].sort((a, b) => {
              let va = a[col],
                vb = b[col];
              if (va == null) va = "";
              if (vb == null) vb = "";
              if (va < vb) return ascending ? -1 : 1;
              if (va > vb) return ascending ? 1 : -1;
              return 0;
            });
          }
          if (st.single) {
            res.data = rows[0] || null;
            if (!rows[0]) res.error = {
              message: "No rows"
            };
          } else if (st.maybe) {
            res.data = rows[0] || null;
          } else res.data = rows;
        } else if (st.op === "insert" || st.op === "upsert") {
          const inserted = [];
          st.payload.forEach(row => {
            const r = {
              ...row
            };
            if (st.op === "upsert") {
              const key = st.upsertKey;
              const idx = db[table].findIndex(x => String(x[key]) === String(r[key]));
              if (idx >= 0) {
                db[table][idx] = {
                  ...db[table][idx],
                  ...r
                };
                inserted.push(db[table][idx]);
                return;
              }
            }
            if (r.id == null) r.id = nextId(table);
            if (r.created_at == null) r.created_at = new Date().toISOString();
            db[table].push(r);
            inserted.push(r);
          });
          save(db);
          res.data = st.wantSelect ? st.single ? inserted[0] || null : inserted : inserted;
        } else if (st.op === "update") {
          const rows = db[table].filter(r => passes(r, st.filters));
          rows.forEach(r => {
            Object.assign(r, st.patch);
          });
          save(db);
          res.data = rows;
        } else if (st.op === "delete") {
          const keep = [],
            removed = [];
          db[table].forEach(r => {
            (passes(r, st.filters) ? removed : keep).push(r);
          });
          db[table] = keep;
          save(db);
          res.data = removed;
        }
      } catch (e) {
        res.error = {
          message: e.message
        };
      }
      return res;
    };
    const builder = {
      select() {
        st.wantSelect = true;
        return builder;
      },
      insert(rows) {
        st.op = "insert";
        st.payload = Array.isArray(rows) ? rows : [rows];
        return builder;
      },
      update(patch) {
        st.op = "update";
        st.patch = patch;
        return builder;
      },
      upsert(rows, opts) {
        st.op = "upsert";
        st.payload = Array.isArray(rows) ? rows : [rows];
        st.upsertKey = opts && opts.onConflict || "id";
        return builder;
      },
      delete() {
        st.op = "delete";
        return builder;
      },
      eq(col, val) {
        st.filters.push({
          type: "eq",
          col,
          val
        });
        return builder;
      },
      in(col, vals) {
        st.filters.push({
          type: "in",
          col,
          val: vals
        });
        return builder;
      },
      order(col, opts) {
        st.order = {
          col,
          ascending: !opts || opts.ascending !== false
        };
        return builder;
      },
      single() {
        st.single = true;
        return builder;
      },
      maybeSingle() {
        st.maybe = true;
        return builder;
      },
      then(resolve, reject) {
        try {
          resolve(exec());
        } catch (e) {
          if (reject) reject(e);
        }
      }
    };
    return builder;
  }

            }
          };
        }
      };
    }
  };
  return {
    from: t => makeBuilder(t),
    storage
  };
}

  const result = [];
  let current = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"') {

    } else if (char === ',' && !inQuotes) {

  }

const parseETD = val => {
  if (!val) return null;
  if (val instanceof Date) return val.toISOString().slice(0, 10);
  const s = String(val).trim();
  const meses = {
    ene: "01",
    feb: "02",
    mar: "03",
    abr: "04",
    may: "05",
    jun: "06",
    jul: "07",
    ago: "08",
    sep: "09",
    oct: "10",
    nov: "11",
    dic: "12"
  };
  const m = s.match(/^(\d{1,2})[-\/](\w{3})[-\/](\d{2,4})$/i);
  if (m) {
    const dia = m[1].padStart(2, "0");
    const mes = meses[m[2].toLowerCase().slice(0, 3)] || "01";
    let anio = m[3];
    if (anio.length === 2) anio = "20" + anio;
    return `${anio}-${mes}-${dia}`;
  }
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  return null;
};

  <script>
  (function(){
    var MAP={dashboard:"Inicio",mi_dia:"Mi Día",pagos:"Control de Pagos",inventario:"Inventario de Telas",embarques:"Embarques",caja:"Control de Caja",config:"Configuración"};
    var TABMAP={movimientos:"MOVIMIENTOS",catalogo:"CATÁLOGO",tablero:"TABLERO"};
    function navigate(){
      var hash=(window.location.hash||"").replace(/^#/,"");
      if(!hash) return;
      var params=new URLSearchParams(hash);
      var vista=params.get("vista"); var tabInv=params.get("tabInv");
      var label=MAP[vista]; if(!label) return;
      var tries=0;
      function tryClick(){
        tries++;
        var btn=Array.prototype.find.call(document.querySelectorAll("button"), function(b){
          var t=(b.textContent||"").trim();
          return t.indexOf(label)>=0 && t.length<60;
        });
        if(btn){
          btn.click();
          if(tabInv && vista==="inventario"){
            var tl=TABMAP[tabInv];
            if(tl){
              var tt=0;
              function tryTab(){
                tt++;
                var tb=Array.prototype.find.call(document.querySelectorAll("button.inv-tab"), function(b){
                  return (b.textContent||"").indexOf(tl)>=0;
                });
                if(tb) tb.click();
                else if(tt<20) setTimeout(tryTab, 200);
              }
              setTimeout(tryTab, 500);
            }
          }
        } else if(tries<30){ setTimeout(tryClick, 200); }
      }
      setTimeout(tryClick, 400);
    }
    window.addEventListener("hashchange", navigate);
    navigate();
  })();
  </script>
